<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
        (() => { let p = 'system'; try { p = localStorage.getItem('nn-playground-theme') || p; } catch {} const t = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; document.documentElement.style.colorScheme = t; })();
    </script>
    <title>NN·FORGE — Neural Network Playground</title>
    <meta name="description"
        content="An interactive neural network playground for learning — explore classification, regression, and decision boundaries in your browser." />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
