name: Release verification

on:
  push:
    branches: [codex/nn-forge-release-roadmap]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact tracked source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-source"
          git rev-parse HEAD > "$RUNNER_TEMP/release-source/source-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/release-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/release-source/source.tar.gz" > "$RUNNER_TEMP/release-source/source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-${{ github.sha }}
          path: ${{ runner.temp }}/release-source/
          retention-days: 7

  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/playwright-target.test.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise real skip-link navigation
        run: pnpm exec playwright test tests/e2e/navigation-integrity.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-contract-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
