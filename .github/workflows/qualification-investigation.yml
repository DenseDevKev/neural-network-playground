name: Qualification investigation

on:
  push:
    branches: [codex/nn-forge-release-roadmap]
    paths: [.github/workflows/qualification-investigation.yml]

permissions:
  contents: read

jobs:
  register-reviewed-lockfile-blob:
    if: github.ref == 'refs/heads/codex/nn-forge-release-roadmap'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare only the three reviewed lockfile additions
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          let content = readFileSync('pnpm-lock.yaml', 'utf8');
          const changes = [
            ['  apps/web:\n    dependencies:\n', "      '@fontsource/inter':\n        specifier: 5.3.0\n        version: 5.3.0\n      '@fontsource/space-grotesk':\n        specifier: 5.3.0\n        version: 5.3.0\n", false],
            ["  '@humanfs/core@0.19.2':\n    resolution:", "  '@fontsource/inter@5.3.0':\n    resolution: {integrity: sha512-RofMylZmjlJEfELXeNHFWBRcSs75rGU/6bV2S2jfnvv/3rPXPGe0LgUJTklcHZ9lM4OZmAVFhcJPnACfb91A3g==}\n\n  '@fontsource/space-grotesk@5.3.0':\n    resolution: {integrity: sha512-ksnGizDPXIDuvqcTYTSrmZ+evx9sDlS8rp7+42BQ7wU+spt3twEoXfbJz672C+5CLg6VeUQwRy5RXshWb67LcQ==}\n\n", true],
            ["  '@exodus/bytes@1.15.0': {}\n", "\n  '@fontsource/inter@5.3.0': {}\n\n  '@fontsource/space-grotesk@5.3.0': {}\n", false],
          ];
          for (const [anchor, addition, before] of changes) {
            if (content.split(anchor).length !== 2) throw new Error('Ambiguous lockfile anchor');
            content = content.replace(anchor, before ? addition + anchor : anchor + addition);
          }
          const bytes = Buffer.from(content);
          const sha = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          if (sha !== '0f95025a6cb614998f597db18e9eeafad57800d5') throw new Error('Reviewed lockfile digest mismatch');
          mkdirSync('font-intake');
          writeFileSync('font-intake/blob-request.json', JSON.stringify({ content, encoding: 'utf-8' }));
          writeFileSync('font-intake/expected-sha.txt', sha + '\n');
          JS
      - name: Register the reviewed Git blob only; do not create commits or update refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input font-intake/blob-request.json --jq .sha > font-intake/registered-sha.txt
          diff font-intake/expected-sha.txt font-intake/registered-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-font-lockfile-${{ github.sha }}
          path: font-intake/*sha.txt
          retention-days: 7
