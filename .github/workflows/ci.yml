name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify infrastructure helpers
        run: node --test scripts/*.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Check production bundle budgets
        run: pnpm test:bundle

      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Upload browser smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
