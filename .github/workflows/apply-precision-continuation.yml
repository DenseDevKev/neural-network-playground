name: Reconcile NN.FORGE living plan

on:
  push:
    branches: [codex/nn-forge-precision-apply]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact plan patch
        shell: bash
        run: |
          echo "603ebe047d515b09f99248c44a7b6a94f9e572a961133a9382c82a10b8a92719  .precision-apply/plan-reconcile.patch" | sha256sum -c -
          cp .precision-apply/plan-reconcile.patch "$RUNNER_TEMP/plan-reconcile.patch"
      - name: Apply guarded plan reconciliation to active branch
        shell: bash
        run: |
          set -euo pipefail
          target='codex/nn-forge-precision-lab'
          expected='5874f777c53b03e190e9cb0b5d92f41b68c92b34'
          git fetch origin "$target"
          actual=$(git rev-parse "origin/$target")
          test "$actual" = "$expected" || { echo "Target moved: expected $expected, found $actual" >&2; exit 1; }
          git checkout -B "$target" "origin/$target"
          git apply --check "$RUNNER_TEMP/plan-reconcile.patch"
          git apply "$RUNNER_TEMP/plan-reconcile.patch"
          git diff --check
          changed=$(git status --porcelain=v1 | wc -l | tr -d ' ')
          test "$changed" = '1' || { echo "Expected one changed path, found $changed" >&2; git status --short; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NN-FORGE-LIVING-EXECUTION-PLAN.md
          git diff --cached --check
          git commit -m 'docs: reconcile Precision Lab execution evidence'
          final=$(git rev-parse HEAD)
          git push origin "HEAD:$target"
          echo "Applied plan reconciliation at $final"
