name: Apply Precision Lab browser fixes

on:
  push:
    branches: [codex/nn-forge-precision-apply]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact browser-fix patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/browser-fixes.patch"
          echo "f58df81f445adde42fbd8a7c811335c73adcee5c7d235df4c724e391f43da9b3  $RUNNER_TEMP/browser-fixes.patch" | sha256sum -c -
      - name: Apply guarded browser fixes to active branch
        shell: bash
        run: |
          set -euo pipefail
          target='codex/nn-forge-precision-lab'
          expected='3b567950d3c725e5dc2856b4331813db26edba39'
          git fetch origin "$target"
          actual=$(git rev-parse "origin/$target")
          test "$actual" = "$expected" || { echo "Target moved: expected $expected, found $actual" >&2; exit 1; }
          git checkout -B "$target" "origin/$target"
          git apply --check "$RUNNER_TEMP/browser-fixes.patch"
          git apply "$RUNNER_TEMP/browser-fixes.patch"
          git diff --check
          changed=$(git status --porcelain=v1 | wc -l | tr -d ' ')
          test "$changed" = '3' || { echo "Expected 3 changed paths, found $changed" >&2; git status --short; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(web): stabilize Precision Lab responsive controls'
          final=$(git rev-parse HEAD)
          git push origin "HEAD:$target"
          echo "Applied browser fixes at $final"
